<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Паспорт путешественника · Знаки Альшея</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Паспорт и путеводитель в одной книжке. Формат А6 (105 × 148 мм), печать с полями «нет».
   Цвета из концепции «Тамги»: бумага, тёмно-синий, красный, зелёный, горчичный. */
@page{size:105mm 148mm;margin:0}
:root{--bg:#F6F2E8;--navy:#1E2550;--red:#C8372D;--green:#2F7A4A;--mus:#E2A92B;--line:rgba(30,37,80,.25)}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#8b8f99;font:400 8.6pt/1.42 "Tinos","Times New Roman",Times,serif;color:var(--navy)}
.pg{width:105mm;height:148mm;background:var(--bg);margin:10mm auto;position:relative;overflow:hidden;padding:9mm 8mm 8mm;display:flex;flex-direction:column;break-after:page;box-shadow:0 6px 18px rgba(0,0,0,.35)}

.dsp{font-family:"Tinos","Times New Roman",Times,serif;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.95}
h1,h2,h3,p{margin:0}
.num{position:absolute;right:7mm;bottom:5mm;font:600 7pt "Tinos","Times New Roman",serif;opacity:.6}
.cover{background:var(--navy);color:#fff}
.cover .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;margin:6mm 0}
.cover .grid i{aspect-ratio:1;display:grid;place-items:center;border:.4mm solid rgba(255,255,255,.35)}
.cover .grid i svg{width:62%}
.cover h1{font-size:19pt;margin-top:3mm}
.cover .sub{font-size:9pt;opacity:.85;margin-top:2mm}
.cover .name{margin-top:auto;border-top:.3mm solid rgba(255,255,255,.5);padding-top:2mm;font-size:8pt;opacity:.9}
.cover .name span{display:block;border-bottom:.3mm solid rgba(255,255,255,.5);height:7mm}
h2{font-size:12pt;margin-bottom:3mm}
.steps{display:grid;gap:2.4mm}
.steps div{display:grid;grid-template-columns:7mm 1fr;gap:2mm;align-items:start}
.steps b{display:grid;place-items:center;width:6mm;height:6mm;background:var(--red);color:#fff;font:700 8pt "Tinos","Times New Roman",Times,serif}
.rew{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm;margin-top:auto}
.rew div{border:.4mm solid var(--navy);padding:2mm;text-align:center}
.rew b{display:block;font:800 15pt "Tinos","Times New Roman",Times,serif;color:var(--red)}
.rew span{font-size:7pt;line-height:1.2;display:block}
.mapsvg{flex:1;min-height:0}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:.6mm 3mm;font-size:6.8pt;margin-top:2mm}
.place .top{display:grid;grid-template-columns:24mm 1fr;gap:3mm;align-items:center}
.place .sign{aspect-ratio:1;display:grid;place-items:center;color:#fff}
.place .sign svg{width:72%}
.place .sign.mustard{color:var(--navy)}
.place h3{font:700 10pt/1.1 "Tinos","Times New Roman",Times,serif;text-transform:uppercase}
.place .ix{font:600 7pt "Tinos","Times New Roman",serif;opacity:.7;margin-bottom:1mm}
.place .t{margin-top:3mm;font-size:8.3pt}
.place .why{margin-top:2mm;font-style:italic;font-size:7.8pt;opacity:.85}
.place .how{margin-top:2mm;font-size:7.8pt}
.place .stamp{margin-top:auto;display:grid;grid-template-columns:30mm 1fr;gap:3mm;align-items:end}
.place .stamp .c{width:30mm;height:30mm;border-radius:50%;border:.5mm dashed var(--line);display:grid;place-items:center;text-align:center;font-size:6.6pt;opacity:.8}
.place .stamp .d{font-size:7pt;border-bottom:.3mm solid var(--line);padding-bottom:1mm}
.back{background:var(--red);color:#fff}
.back p{font-size:9pt;margin-top:3mm}
.bar{position:sticky;top:0;z-index:2;background:#1E2550;color:#fff;padding:10px 16px;font:500 14px "Tinos","Times New Roman",Times,serif;display:flex;gap:12px;align-items:center;justify-content:center}
.bar button{font:600 14px "Tinos","Times New Roman",Times,serif;background:#E2A92B;color:#1E2550;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
.pg:last-child{break-after:auto}
@media print{body{background:none}.pg{margin:0;box-shadow:none}.bar{display:none!important}}
</style>
</head>
<body>
<div class="bar">Паспорт путешественника · 16 страниц формата А6 <button type="button" onclick="print()">Печать</button></div>
<div id="book"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/boundary.js"></script>
<script>
(function(){
const PL={}; D.places.forEach(p=>PL[p.id]=p);
const R=D.route.map((r,i)=>Object.assign({},r,{i:i+1,p:PL[r.id]}));
const COL={red:'#C8372D',green:'#2F7A4A',navy:'#1E2550',mustard:'#E2A92B'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sign=(k,w=3.4)=>`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="${D.signs[k]}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const pages=[];
let pn=0; const P=(cls,html)=>{pn++;pages.push(`<section class="pg ${cls}">${html}${cls.includes('cover')||cls.includes('back')?'':`<span class="num">${pn}</span>`}</section>`);};

P('cover',`<div style="font:600 8pt Tinos,"Times New Roman",serif;letter-spacing:.14em;text-transform:uppercase;opacity:.8">Альшеевский район</div>
  <div class="grid">${R.map(r=>`<i style="color:${r.color==='navy'?'#F6F2E8':COL[r.color]}">${sign(r.sign,3.6)}</i>`).join('')}</div>
  <h1 class="dsp">Паспорт путешественника</h1>
  <p class="sub">12 мест и 12 знаков Альшея. Самостоятельный маршрут и путеводитель в одной книжке</p>
  <div class="name">Владелец паспорта<span></span></div>`);

P('',`<h2 class="dsp">Как пользоваться</h2>
  <div class="steps">
    <div><b>1</b><p>Паспорт выдают в кафе «Триумф» в Раевском, Магистральная улица, 2В. Там же расскажут, с чего начать.</p></div>
    <div><b>2</b><p>У каждого места стоит табличка со знаком. Найдите её и поставьте отметку в паспорте у партнёра или отметьтесь на сайте по QR-коду.</p></div>
    <div><b>3</b><p>Знаки можно собирать в любом порядке и за несколько поездок. Удобный порядок показан на карте.</p></div>
    <div><b>4</b><p>Покажите паспорт в кафе «Триумф» и получите подарок.</p></div>
  </div>
  <div class="rew">${D.rewards.map(w=>`<div><b>${w.n}</b><span>${esc(w.t)}</span></div>`).join('')}</div>`);

/* карта: граница района и точки маршрута, без подложки */
const pts=window.ALSHEY_BOUNDARY.concat(R.map(r=>r.p.ll));
const lat0=pts.reduce((a,p)=>a+p[0],0)/pts.length, k=Math.cos(lat0*Math.PI/180);
const xs=pts.map(p=>p[1]*k), ys=pts.map(p=>p[0]);
const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
const W=300,H=300*(maxY-minY)/(maxX-minX),pad=12;
const pr=ll=>[pad+(ll[1]*k-minX)/(maxX-minX)*(W-2*pad), pad+(maxY-ll[0])/(maxY-minY)*(H-2*pad)];
const bd='M'+window.ALSHEY_BOUNDARY.map(p=>pr(p).map(v=>v.toFixed(1)).join(' ')).join(' L')+'Z';
const rt='M'+R.map(r=>pr(r.p.ll).map(v=>v.toFixed(1)).join(' ')).join(' L');
P('',`<h2 class="dsp">Карта маршрута</h2>
  <svg class="mapsvg" viewBox="0 0 ${W} ${H.toFixed(0)}" preserveAspectRatio="xMidYMid meet"><path d="${bd}" fill="#EAE4D6" stroke="#1E2550" stroke-width="1.2" stroke-dasharray="4 3"/><path d="${rt}" fill="none" stroke="#C8372D" stroke-width="1.6" stroke-dasharray="1.5 4" stroke-linecap="round"/>
  ${(()=>{const P=R.map(r=>{const [x,y]=pr(r.p.ll);return{r,x,y};});for(let it=0;it<80;it++)for(let a=0;a<P.length;a++)for(let b=a+1;b<P.length;b++){const A=P[a],B=P[b];let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);if(d<18){if(d<.01){dx=1;dy=0;d=1;}const f=(18-d)/2/d;A.x-=dx*f;A.y-=dy*f;B.x+=dx*f;B.y+=dy*f;}}return P;})().map(({r,x,y})=>{return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-8" y="-8" width="16" height="16" fill="${COL[r.color]}"/><text y="3.2" text-anchor="middle" font-family="Tinos","Times New Roman",serif font-weight="600" font-size="8" fill="${r.color==='mustard'?'#1E2550':'#fff'}">${r.i}</text></g>`;}).join('')}</svg>
  <div class="legend">${R.map(r=>`<span>${r.i}. ${esc(r.p.n.replace(/ \(.*\)$/,''))}</span>`).join('')}</div>`);

R.forEach(r=>{const p=r.p;
  P('place',`<div class="top"><div class="sign ${r.color}" style="background:${COL[r.color]}">${sign(r.sign,3.2)}</div><div><div class="ix">Знак ${String(r.i).padStart(2,'0')}</div><h3>${esc(p.n)}</h3></div></div>
    <p class="t">${esc(p.txt.length>330?p.txt.slice(0,p.txt.lastIndexOf('.',330)+1):p.txt)}</p>
    <p class="why">Почему такой знак. ${esc(r.why)}</p>
    <p class="how"><b>Как найти.</b> ${esc(r.how)}</p>
    <div class="stamp"><div class="c">место<br>для отметки</div><div class="d">Дата<br><br>Подпись</div></div>`);});

P('back',`<h2 class="dsp" style="font-size:15pt">Земля Альшея</h2>
  <p>Паспорт выдают и обменивают на подарки в кафе «Триумф», Раевский, Магистральная улица, 2В.</p>
  <p>Новости маршрута в группе «Триумф добрых дел» ВКонтакте, vk.ru/triumf_gridina.</p>
  <p style="margin-top:auto;font-size:7.5pt;opacity:.9">Знаки нарисованы по мотивам тамг и не повторяют настоящие родовые знаки. Описания мест взяты из реестра объектов района.</p>`);

document.getElementById('book').innerHTML=pages.join('');
})();
</script>
</body>
</html>
